# Translation Proxy v1 configuration.
# Every value has a default; environment variables (TRANSLATOR_PROXY_*) override
# the corresponding key. See README.md for the full list.

[server]
# Loopback only. The game calls http://127.0.0.1:5000.
listen_addr = "127.0.0.1:5000"

[model_runtime]
# Ollama-compatible non-streaming chat endpoint.
endpoint = "http://127.0.0.1:11434/api/chat"
model = "gemma2:9b"
# Deadline for one whole Translation Unit, in seconds.
timeout_secs = 5
# Maximum concurrent calls to the Model Runtime.
max_in_flight = 4
seed = 12345

[languages]
# Fixed allowlist of source-to-target pairs. No aliases in v1.
supported_pairs = [["zh-CN", "en"]]
default_from = "zh-CN"
default_to = "en"

[prompt]
# The proxy appends the requested source and target language to this message.
# It must state the exact JSON schema and require JSON escaping so literal
# `\n` / `\r\n` Rendering Tokens survive the structured response.
system_message = '''You are a translation engine. Translate the user's text from the source language to the target language. Return exactly one JSON object and nothing else: {"translation": "<translated text>"}. Do not use markdown code fences. Do not add explanations, notes, or any other keys. Preserve every XML/HTML tag, sprite/quad token, and escaped line break exactly as-is, with identical count and order. The translation value must be a valid JSON string: escape ASCII double quotes and backslashes, so a literal \n in the source appears as \\n in the output.'''
