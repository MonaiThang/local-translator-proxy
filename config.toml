# Translation Proxy v1 configuration.
# Local values; copy config.example.toml for a documented template.
# Environment variables (TRANSLATOR_PROXY_*) override these values.

[server]
listen_addr = "127.0.0.1:5000"

[model_runtime]
endpoint = "http://127.0.0.1:11434/api/chat"
model = "gemma2:9b"
timeout_secs = 5
max_in_flight = 4
seed = 12345

[languages]
supported_pairs = [["zh-CN", "en"]]
default_from = "zh-CN"
default_to = "en"

[prompt]
# Must state the exact JSON schema; the client appends the source/target language.
system_message = '''You are a translation engine. Translate the user's text from the source language to the target language. Return exactly one JSON object and nothing else: {"translation": "<translated text>"}. Do not use markdown code fences. Do not add explanations, notes, or any other keys. Preserve every XML/HTML tag, sprite/quad token, and escaped line break exactly as-is, with identical count and order. The translation value must be a valid JSON string: escape ASCII double quotes and backslashes, so a literal \n in the source appears as \\n in the output.'''
